   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="15.2352" y="15.1464" transform="rotate(-0 15.2352 15.1464)">PartB machine-learning flow: baseline eCRF → incident mobility-limitation trajectory class</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 216.280908)">*LCGM/GMM fitted for class enumeration; GMM gave</text>
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 222.615625)">non-positive-definite (Heywood/boundary) solutions,</text>
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 228.950342)">so LCGA was retained (CHARLS 3 / ELSA 3 / HRS 2 classes).</text>
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 235.285059)">Trajectory built on the 70% training set only; the 30%</text>
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 241.619776)">test set was assigned by posterior probabilities (no leakage).</text>
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 247.954492)">A single model (Random Forest) suffices for a single</text>
    <text style="font-size: 5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #4a4a4a" transform="translate(15.2352 254.289209)">continuous predictor (eCRF); no 1000× repetition was done.</text>
   </g>
  </g>
